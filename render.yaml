# Render Blueprint — free Node web service for Socket.io + Next.js custom server.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: live-talk-radio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      # Set in Render dashboard (do not put real secrets in git)
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # After deploy: set to https://your-service.onrender.com so Share is always public
      - key: PUBLIC_APP_URL
        sync: false
