# Render Blueprint — FREE web service only ($0).
# No secret prompts on create (LiveKit can be added later in the dashboard).
#
# https://render.com/docs/blueprint-spec
# https://render.com/docs/free

services:
  - type: web
    name: live-talk-radio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
