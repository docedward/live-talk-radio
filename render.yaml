# Render Blueprint — FREE web service only ($0).
#
# Important: do NOT set NODE_ENV=production as a service env var for the build.
# That makes `npm ci` skip devDependencies (Tailwind/PostCSS) and the Next build fails.
# startCommand already sets production for the running app.
#
# https://render.com/docs/free

services:
  - type: web
    name: live-talk-radio
    runtime: node
    plan: free
    region: oregon
    # --include=dev: install build tools even if NODE_ENV is production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
